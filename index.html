<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Meta tag crucial para móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Generador de Pases de Boda</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        wine: '#722F37',
                        cream: '#F5F2EB'
                    },
                    fontFamily: {
                        cursive: ['"Great Vibes"', 'cursive'],
                        serif: ['Cinzel', 'serif']
                    }
                }
            }
        }
    </script>
    
    <style>
        .pass-card {
            width: 11.5cm;
            height: 7cm;
            background-color: #F5F2EB;
            position: relative;
            box-sizing: border-box;
            border: 1px solid #e5e7eb;
            overflow: visible; 
            flex-shrink: 0;
            display: flex;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: all 0.2s ease;
        }

        /* Hover desactivado en móviles por naturaleza, pero activo en PC */
        @media (hover: hover) {
            .pass-card:hover {
                box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* ESCALADO INTELIGENTE PARA PANTALLAS MÓVILES */
        /* Si la pantalla es menor a 500px, encogemos visualmente el pase pero conservamos su medida de impresión */
        @media (max-width: 500px) {
            .card-wrapper {
                transform: scale(0.85);
                transform-origin: top center;
                margin-bottom: -1cm; /* Compensa el espacio sobrante del escalado */
            }
        }
        @media (max-width: 400px) {
            .card-wrapper {
                transform: scale(0.72);
                transform-origin: top center;
                margin-bottom: -1.9cm;
            }
